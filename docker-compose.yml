services:
  postgres:
    image: postgres:17
    container_name: task-list-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_list
    ports:
      - "5432:5432"
    volumes:
      - tasklist_pgdata:/var/lib/postgresql/data

volumes:
  tasklist_pgdata:
